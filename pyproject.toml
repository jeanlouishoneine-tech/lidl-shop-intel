[project]
name = "lidl-app"
version = "0.1.0"
description = "A Dash web app that visualizes Lidl Plus purchase history and provides AI-powered spending insights via Ollama."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dash>=4.1.0",
    "lidlplus-api>=0.0.5",
    "numpy>=2.4.6",
    "ollama>=0.6.2",
    "playwright>=1.60.0",
    "plotly>=6.7.0",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.4",
    "pre-commit>=3.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
warn_return_any = true
warn_unused_ignores = true
